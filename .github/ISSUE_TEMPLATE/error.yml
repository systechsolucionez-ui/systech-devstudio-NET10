name: Reportar un error
description: Algo no funciona como dice el manual.
title: "[Error] "
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. **Si es un problema de seguridad, no lo publiques acá:** escribí a systechsolucionez@gmail.com (ver SECURITY.md).
        Antes de pegar registros, sacales cualquier clave, token, contraseña o código privado de tus clientes.
  - type: input
    id: version
    attributes:
      label: Versión de SYSTECH Studio
      description: La ves en el pie de la interfaz o en "Acerca de".
      placeholder: v1.1.0
    validations:
      required: true
  - type: dropdown
    id: donde
    attributes:
      label: ¿Dónde lo usás?
      options:
        - GitHub Codespaces (con el .devcontainer del repo)
        - Mi computadora (Linux / macOS / WSL)
        - Otro
    validations:
      required: true
  - type: dropdown
    id: pantalla
    attributes:
      label: ¿En qué parte pasó?
      options:
        - Arranque (scripts/start.sh)
        - Nuevo trabajo
        - Taller / verificación 1
        - Taller / verificación 2 (revisor o entorno limpio)
        - Entrega / descarga / GitHub
        - Otra
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Creé un trabajo con…
        2. Toqué…
        3. Apareció…
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas y qué pasó
    validations:
      required: true
  - type: textarea
    id: registros
    attributes:
      label: Registros (sin datos sensibles)
      description: Salida de la terminal o el registro del paso que falló (Taller → Registros completos).
      render: text
